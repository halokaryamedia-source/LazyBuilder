name: Local Promotion Verify

on:
  pull_request:
    branches:
      - Local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Local promotion gate
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop promotion source
        if: github.event_name == 'pull_request'
        run: |
          test "${{ github.head_ref }}" = "develop" || {
            echo "Local promotion must come from develop." >&2
            exit 1
          }

      - name: Checkout candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify repository contracts
        run: python tools/verify_repository.py

      - name: Verify complete pre-runtime contract
        run: python tools/verify_test_readiness.py

      - name: Run generation contract tests
        working-directory: kits/lazy-builder/generation
        run: python -m unittest -v test_generation_contract.py

      - name: Run session and artifact contract tests
        working-directory: kits/lazy-builder/validator
        run: python -m unittest -v test_test_readiness.py test_artifact_validation.py

      - name: Run static session dry-run
        run: python kits/lazy-builder/validator/dry_run_readiness.py

      - name: Run Minecraftize pure tests
        working-directory: kits/lazy-builder/minecraftize
        run: python -m unittest -v test_block_model.py test_minecraftize_v0.py

      - name: Compile runtime entrypoints without launching runtime apps
        run: |
          python -m py_compile kits/lazy-builder/generation/generate_text_reference.py
          python -m py_compile kits/lazy-builder/generation/generate_shape.py
          python -m py_compile kits/lazy-builder/blender/write_target_metadata.py
          python -m py_compile kits/lazy-builder/minecraftize/minecraftize_v0.py
          python -m py_compile kits/lazy-builder/minecraftize/run_primitive_suite.py
          python -m py_compile kits/lazy-builder/validator/collect_environment.py

      - name: Promotion policy reminder
        if: github.event_name == 'pull_request'
        run: |
          echo "Required merge method: squash."
          echo "One approved develop -> Local promotion must create exactly one new Local commit."
          echo "After merge, synchronize develop to the resulting Local HEAD before new development."
