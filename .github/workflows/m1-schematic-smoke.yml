name: M1 Schematic Smoke

on:
  push:
    branches:
      - develop
    paths:
      - "requirements.txt"
      - "tools/m1_schematic_smoke.py"
      - "kits/lazy-builder/schematic/**"
      - "kits/lazy-builder/validator/**"
      - ".github/workflows/m1-schematic-smoke.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Generate and reload schematic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install schematic writer
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate and reload M1 fixture
        run: python tools/m1_schematic_smoke.py --output-dir artifacts/m1 --version JE_1_21_4

      - name: Require generated schematic
        run: test -s artifacts/m1/lazybuilder_m1_smoke.schem

      - name: Upload Axiom test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazybuilder-m1-schematic-je-1-21-4
          path: artifacts/m1/
          if-no-files-found: error
          retention-days: 14
