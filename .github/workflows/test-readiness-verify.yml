name: Test Readiness Verify

on:
  push:
    branches: [develop, Local]
    paths:
      - 'kits/lazy-builder/validator/**'
      - 'kits/lazy-builder/minecraftize/**'
      - 'kits/lazy-builder/schematic/**'
      - 'kits/lazy-builder/generation/**'
      - 'kits/lazy-builder/blender/**'
      - 'tools/verify_test_readiness.py'
      - 'requirements.txt'
      - '.github/workflows/test-readiness-verify.yml'
  pull_request:
    branches: [Local]
    paths:
      - 'kits/lazy-builder/validator/**'
      - 'kits/lazy-builder/minecraftize/**'
      - 'kits/lazy-builder/schematic/**'
      - 'kits/lazy-builder/generation/**'
      - 'kits/lazy-builder/blender/**'
      - 'tools/verify_test_readiness.py'
      - 'requirements.txt'
      - '.github/workflows/test-readiness-verify.yml'

permissions:
  contents: read

jobs:
  deterministic-readiness:
    name: Deterministic end-to-end readiness contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify readiness owners
        run: python tools/verify_test_readiness.py
      - name: Run session/controller tests
        working-directory: kits/lazy-builder/validator
        run: python -m unittest -v test_test_readiness.py
      - name: Run static session dry-run
        run: python kits/lazy-builder/validator/dry_run_readiness.py
      - name: Run block-model and V0 pure tests
        working-directory: kits/lazy-builder/minecraftize
        run: python -m unittest -v test_block_model.py test_minecraftize_v0.py
      - name: Compile Blender runtime entrypoints without launching Blender
        run: |
          python -m py_compile kits/lazy-builder/minecraftize/minecraftize_v0.py
          python -m py_compile kits/lazy-builder/minecraftize/run_primitive_suite.py
      - name: Build canonical serialization fixture
        run: |
          python kits/lazy-builder/minecraftize/build_primitive_fixture.py --output-dir /tmp/lazybuilder-primitives
          test -s /tmp/lazybuilder-primitives/blocks.json
          test -s /tmp/lazybuilder-primitives/report.json
      - name: Install pinned schematic writer
        run: python -m pip install -r requirements.txt
      - name: Export fixture through general blocks.json writer
        run: |
          python kits/lazy-builder/schematic/export_blocks.py \
            --blocks /tmp/lazybuilder-primitives/blocks.json \
            --output-dir /tmp/lazybuilder-schematic \
            --name readiness
          test -s /tmp/lazybuilder-schematic/readiness.schem
          test -s /tmp/lazybuilder-schematic/manifest.json
          grep -F 'WRITER_ROUND_TRIP_PASS_RUNTIME_AXIOM_REQUIRED' /tmp/lazybuilder-schematic/manifest.json
