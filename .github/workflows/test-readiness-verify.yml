name: Pre-Runtime Verify

on:
  push:
    branches: [develop, Local]
    paths:
      - 'README.md'
      - 'CONTEXT.md'
      - 'docs/foundation/**'
      - 'docs/knowledge/next-action.md'
      - 'kits/lazy-builder/intake/**'
      - 'kits/lazy-builder/validator/**'
      - 'kits/lazy-builder/minecraftize/**'
      - 'kits/lazy-builder/schematic/**'
      - 'kits/lazy-builder/generation/**'
      - 'kits/lazy-builder/blender/**'
      - 'tools/verify_test_readiness.py'
      - 'requirements.txt'
      - '.github/workflows/test-readiness-verify.yml'
  pull_request:
    branches: [Local]
    paths:
      - 'README.md'
      - 'CONTEXT.md'
      - 'docs/foundation/**'
      - 'docs/knowledge/next-action.md'
      - 'kits/lazy-builder/intake/**'
      - 'kits/lazy-builder/validator/**'
      - 'kits/lazy-builder/minecraftize/**'
      - 'kits/lazy-builder/schematic/**'
      - 'kits/lazy-builder/generation/**'
      - 'kits/lazy-builder/blender/**'
      - 'tools/verify_test_readiness.py'
      - 'requirements.txt'
      - '.github/workflows/test-readiness-verify.yml'

permissions:
  contents: read

jobs:
  deterministic-pre-runtime:
    name: Deterministic pre-runtime contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pre-runtime owners and synchronization
        run: python tools/verify_test_readiness.py
      - name: Run generation contract tests
        working-directory: kits/lazy-builder/generation
        run: python -m unittest -v test_generation_contract.py
      - name: Run session and artifact contract tests
        working-directory: kits/lazy-builder/validator
        run: python -m unittest -v test_test_readiness.py test_artifact_validation.py
      - name: Run static session dry-run
        run: python kits/lazy-builder/validator/dry_run_readiness.py
      - name: Run block-model and V0 pure tests
        working-directory: kits/lazy-builder/minecraftize
        run: python -m unittest -v test_block_model.py test_minecraftize_v0.py
      - name: Compile runtime entrypoints without launching runtime apps
        run: |
          python -m py_compile kits/lazy-builder/generation/generate_text_reference.py
          python -m py_compile kits/lazy-builder/generation/generate_shape.py
          python -m py_compile kits/lazy-builder/blender/write_target_metadata.py
          python -m py_compile kits/lazy-builder/minecraftize/minecraftize_v0.py
          python -m py_compile kits/lazy-builder/minecraftize/run_primitive_suite.py
          python -m py_compile kits/lazy-builder/validator/collect_environment.py
      - name: Build canonical serialization fixture and preview
        run: |
          python kits/lazy-builder/minecraftize/build_primitive_fixture.py --output-dir /tmp/lazybuilder-primitives
          test -s /tmp/lazybuilder-primitives/blocks.json
          test -s /tmp/lazybuilder-primitives/report.json
          python kits/lazy-builder/minecraftize/build_preview.py \
            --blocks /tmp/lazybuilder-primitives/blocks.json \
            --output-dir /tmp/lazybuilder-preview
          test -s /tmp/lazybuilder-preview/preview.svg
          test -s /tmp/lazybuilder-preview/manifest.json
          grep -F 'PREVIEW_READY_FROM_CANONICAL_BLOCKS' /tmp/lazybuilder-preview/manifest.json
      - name: Install pinned schematic writer
        run: python -m pip install -r requirements.txt
      - name: Export fixture through general blocks.json writer
        run: |
          python kits/lazy-builder/schematic/export_blocks.py \
            --blocks /tmp/lazybuilder-primitives/blocks.json \
            --output-dir /tmp/lazybuilder-schematic \
            --name readiness
          test -s /tmp/lazybuilder-schematic/readiness.schem
          test -s /tmp/lazybuilder-schematic/manifest.json
          grep -F 'WRITER_ROUND_TRIP_PASS_RUNTIME_AXIOM_REQUIRED' /tmp/lazybuilder-schematic/manifest.json
